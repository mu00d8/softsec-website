    :root {
      --bg:       #efede9;
      --navy:     #1c3052;
      --ink:      #3c3c3c;
      --ink-soft: #6a6a6a;
      --rule:     #c4bfb8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Fira Sans", system-ui, -apple-system, sans-serif;
      font-weight: 300; font-size: 17px; line-height: 1.75;
      color: var(--ink); background: var(--bg);
      min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--navy); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    .site-nav { background: var(--navy); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .nav-inner { max-width: 960px; margin: 0 auto; padding: 0 40px; height: 54px; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-weight: 600; font-size: 1rem; color: #fff; display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .nav-brand img { width: 22px; height: 22px; filter: brightness(0) invert(1); opacity: 0.6; }
    .nav-back { font-size: 0.88rem; color: rgba(255,255,255,0.55); }
    .nav-back:hover { color: #fff; text-decoration: none; }
    .theme-toggle {
      background: none; border: none; cursor: pointer; line-height: 1;
      color: rgba(255,255,255,0.55); font-size: 0.95rem;
      padding: 6px 8px; border-radius: 4px; transition: color 0.15s;
      flex-shrink: 0; margin-left: 14px;
    }
    .theme-toggle:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .theme-toggle svg { display: block; width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle svg.icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle svg.icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle svg.icon-sun { display: block; }

    /* Content */
    main { flex: 1; padding: 64px 0 80px; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 40px; }
    @media (max-width: 640px) { .wrap { padding: 0 24px; } main { padding: 40px 0 56px; } }

    .doc { max-width: 640px; }
    .doc h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; color: var(--navy); margin-bottom: 36px; }
    .doc h2 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--navy); opacity: 0.5; margin: 28px 0 8px; }
    .doc h2:first-of-type { margin-top: 0; }
    .doc p { font-size: 0.97rem; font-weight: 300; color: var(--ink); margin-bottom: 4px; line-height: 1.7; }

    /* Footer */
    footer { background: var(--navy); color: rgba(255,255,255,0.3); padding: 22px 0; font-size: 0.8rem; font-weight: 300; border-top: 1px solid rgba(255,255,255,0.06); }
    .footer-inner { max-width: 960px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    footer a { color: rgba(255,255,255,0.35); }
    footer a:hover { color: rgba(255,255,255,0.7); text-decoration: none; }

    /* Dark mode */
    [data-theme="dark"] {
      --bg: #0f1c2d;
      --navy: #081422;
      --ink: #dce8f5;
      --ink-soft: #8aa4bf;
      --rule: rgba(255,255,255,0.1);

    [data-theme="dark"] a:hover { color: #a8ccf8; }
    [data-theme="dark"] .doc h1 { color: #dce8f5; }

<script>
  const toggle = document.getElementById('theme-toggle');
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  toggle.addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  });
</script>
